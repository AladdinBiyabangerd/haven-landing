      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E8F0F4"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="120" x2="520" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
