  <text x="96" y="330" fill="#4F5D73" font-family="Avenir Next, Segoe UI, sans-serif" font-size="34" font-weight="600">Tables · Rooms · Live floor · Cash</text>
  <rect x="96" y="390" width="220" height="10" rx="5" fill="url(#accent)"/>
